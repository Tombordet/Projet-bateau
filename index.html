<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gouvernail · micro:bit</title>
<style>
  :root {
    --bg1: #06121f; --bg2: #0b2540; --card: rgba(16, 42, 70, .82);
    --line: rgba(120, 180, 230, .18); --text: #e8f1fa; --muted: #8fa9c4;
    --accent: #2fb3ff; --accent2: #1478c8; --ok: #2ecc9a; --bad: #ff5c6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg1));
    background-attachment: fixed;
    display: flex; justify-content: center; align-items: flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  .card {
    width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--line); border-radius: 24px; padding: 22px 20px;
    backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: .02em; }
  h1 small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
    border-radius: 999px; font-size: .78rem; font-weight: 600;
    background: rgba(255, 92, 108, .14); color: var(--bad); border: 1px solid rgba(255, 92, 108, .35);
  }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.on { background: rgba(46, 204, 154, .14); color: var(--ok); border-color: rgba(46, 204, 154, .4); }

  button {
    font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 16px;
    background: rgba(255, 255, 255, .06); padding: 15px 10px; font-weight: 600; font-size: 1rem;
    cursor: pointer; touch-action: manipulation; transition: transform .08s, background .15s, opacity .15s;
  }
  button:active:not(:disabled) { transform: scale(.97); background: rgba(255, 255, 255, .12); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #connectBtn {
    width: 100%; margin-top: 18px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #04121f;
  }
  #connectBtn.on { background: rgba(255, 255, 255, .06); color: var(--text); border: 1px solid var(--line); }

  .gauge { position: relative; height: 130px; margin: 22px 0 4px; display: flex; justify-content: center; }
  .gauge svg { width: 100%; max-width: 280px; overflow: visible; }
  #needle { transform-origin: 140px 120px; transition: transform .12s ease-out; }
  .readout { text-align: center; margin-top: -6px; }
  .angle { font-size: 3.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .angle span { font-size: 1.6rem; color: var(--accent); margin-left: 2px; }
  .sub { color: var(--muted); font-size: .8rem; margin-top: 6px; }

  .slider-wrap { margin: 22px 0 6px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; touch-action: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 8px; background: linear-gradient(90deg, #1478c8, #2fb3ff);
  }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #1478c8, #2fb3ff); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; margin-top: -12px;
    background: #fff; border: 4px solid var(--accent); box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
  }
  input[type=range]::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 4px solid var(--accent);
  }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; }

  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .buttons .reset { grid-column: 1 / -1; }

  .log-title { margin: 20px 0 6px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  #log {
    height: 120px; overflow-y: auto; background: rgba(0, 0, 0, .28); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 12px; font: .74rem/1.5 ui-monospace, Menlo, monospace; color: #b9d2ea;
  }
  #log .err { color: var(--bad); }
  #log .ok { color: var(--ok); }
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>⚓ Gouvernail<small>Télécommande micro:bit · BLE UART</small></h1>
    <div id="badge" class="badge">Déconnecté</div>
  </header>

  <button id="connectBtn">Connecter la micro:bit</button>

  <section class="gauge" aria-hidden="true">
    <svg viewBox="0 0 280 130">
      <path d="M 30 120 A 110 110 0 0 1 250 120" fill="none" stroke="rgba(120,180,230,.22)" stroke-width="10" stroke-linecap="round"/>
      <line x1="140" y1="120" x2="140" y2="14" stroke="rgba(120,180,230,.25)" stroke-width="2" stroke-dasharray="4 5"/>
      <g id="needle">
        <line x1="140" y1="120" x2="140" y2="24" stroke="#2fb3ff" stroke-width="6" stroke-linecap="round"/>
      </g>
      <circle cx="140" cy="120" r="10" fill="#e8f1fa"/>
    </svg>
  </section>

  <div class="readout">
    <div class="angle"><b id="angleVal">90</b><span>°</span></div>
    <div class="sub">Angle actuel · neutre 90°</div>
  </div>

  <div class="slider-wrap">
    <input id="slider" type="range" min="55" max="125" step="1" value="90" disabled aria-label="Angle du gouvernail">
    <div class="scale"><span>55° Bâbord</span><span>Tribord 125°</span></div>
  </div>

  <div class="buttons">
    <button id="portBtn" disabled>◄ Bâbord</button>
    <button id="stbdBtn" disabled>Tribord ►</button>
    <button id="resetBtn" class="reset" disabled>Remise à 0 (90°)</button>
  </div>

  <div class="log-title">État / journal</div>
  <div id="log"></div>
</main>

<script>
(() => {
  "use strict";
  const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const UART_RX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const MIN = 55, MAX = 125, NEUTRAL = 90, STEP = 5, THROTTLE_MS = 60;

  const $ = id => document.getElementById(id);
  const slider = $("slider"), angleVal = $("angleVal"), needle = $("needle");
  const badge = $("badge"), connectBtn = $("connectBtn"), logEl = $("log");
  const portBtn = $("portBtn"), stbdBtn = $("stbdBtn"), resetBtn = $("resetBtn");

  let device = null, rxChar = null;
  let angle = NEUTRAL;
  let pending = null, sending = false;
  let lastSend = 0, throttleTimer = null;

  const clamp = v => Math.min(MAX, Math.max(MIN, Math.round(v)));

  function log(msg, cls = "") {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    const t = new Date().toLocaleTimeString("fr-FR");
    d.textContent = t + "  " + msg;
    logEl.appendChild(d);
    while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function render() {
    angleVal.textContent = angle;
    slider.value = angle;
    needle.style.transform = "rotate(" + ((angle - NEUTRAL) * (50 / 35)) + "deg)";
  }

  function setUiConnected(on) {
    badge.textContent = on ? "Connecté" : "Déconnecté";
    badge.classList.toggle("on", on);
    connectBtn.textContent = on ? "Déconnecter" : "Connecter la micro:bit";
    connectBtn.classList.toggle("on", on);
    [slider, portBtn, stbdBtn, resetBtn].forEach(el => el.disabled = !on);
  }

  /* ---------- Envoi BLE (file : toujours la dernière valeur) ---------- */
  async function writeAngle(a) {
    const data = new TextEncoder().encode(a + "\n");
    if (typeof rxChar.writeValueWithoutResponse === "function") {
      try {
        await rxChar.writeValueWithoutResponse(data);
        return;
      } catch (e) {
        log("Écriture sans réponse refusée, repli sur writeValue…", "err");
      }
    }
    await rxChar.writeValue(data);
  }

  async function flush() {
    if (sending) return;
    sending = true;
    try {
      while (pending !== null && rxChar) {
        const a = pending;
        pending = null;
        await writeAngle(a);
        lastSend = Date.now();
      }
    } catch (e) {
      log("Erreur d’envoi : " + (e && e.message ? e.message : e), "err");
    } finally {
      sending = false;
    }
  }

  function sendNow(a) {
    if (throttleTimer) { clearTimeout(throttleTimer); throttleTimer = null; }
    if (!rxChar) { log("Non connecté : angle non envoyé.", "err"); return; }
    pending = a;
    flush();
  }

  function sendThrottled(a) {
    if (!rxChar) return;
    const wait = THROTTLE_MS - (Date.now() - lastSend);
    if (wait <= 0 && !throttleTimer) { sendNow(a); return; }
    if (throttleTimer) return; // le timer enverra la valeur la plus récente
    throttleTimer = setTimeout(() => { throttleTimer = null; sendNow(angle); }, Math.max(wait, 0));
  }

  /* ---------- Commandes ---------- */
  function setAngle(v, mode) {
    angle = clamp(v);
    render();
    if (mode === "now") sendNow(angle);
    else if (mode === "throttle") sendThrottled(angle);
  }

  slider.addEventListener("input",  () => setAngle(slider.value, "throttle"));
  slider.addEventListener("change", () => setAngle(slider.value, "now"));
  portBtn.addEventListener("click",  () => setAngle(angle - STEP, "now"));
  stbdBtn.addEventListener("click",  () => setAngle(angle + STEP, "now"));
  resetBtn.addEventListener("click", () => setAngle(NEUTRAL, "now"));

  /* ---------- Connexion ---------- */
  async function connect() {
    if (!navigator.bluetooth) {
      log("Web Bluetooth indisponible. Ouvre cette page dans Bluefy.", "err");
      return;
    }
    try {
      connectBtn.disabled = true;
      log("Recherche de la micro:bit…");
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "BBC micro:bit" }, { services: [UART_SERVICE] }],
        optionalServices: [UART_SERVICE]
      });
      device.addEventListener("gattserverdisconnected", onDisconnected);
      log("Connexion à " + (device.name || "l’appareil") + "…");
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(UART_SERVICE);
      rxChar = await service.getCharacteristic(UART_RX);
      setUiConnected(true);
      log("Connecté au service UART.", "ok");
      setAngle(NEUTRAL, "now"); // synchronise l’interface et le servo
    } catch (e) {
      rxChar = null;
      setUiConnected(false);
      log("Échec de connexion : " + (e && e.message ? e.message : e), "err");
    } finally {
      connectBtn.disabled = false;
    }
  }

  function onDisconnected() {
    rxChar = null; pending = null;
    if (throttleTimer) { clearTimeout(throttleTimer); throttleTimer = null; }
    setUiConnected(false);
    log("Déconnecté.", "err");
  }

  connectBtn.addEventListener("click", () => {
    if (device && device.gatt && device.gatt.connected) device.gatt.disconnect();
    else connect();
  });

  setUiConnected(false);
  render();
  log("Prêt. Appuie sur « Connecter la micro:bit ».");
})();
</script>
</body>
</html>
