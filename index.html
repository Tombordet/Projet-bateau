<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06283d">
<title>Gouvernail du bateau</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background-color: #06283d; }
  body {
    margin: 0; padding: 16px 16px 32px;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
    background-color: #06283d; color: #e9f4f6;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  main { width: 100%; max-width: 440px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 700; color: #e9f4f6; }
  #etat { font-size: .85rem; color: #8fb4c4; }
  #etat i { width: 10px; height: 10px; border-radius: 50%; background: #8fb4c4; display: inline-block; margin-right: 6px; }
  #etat.ok i { background: #3ddc97; }
  #etat.ko i { background: #ff5d5d; }

  .scene {
    border-radius: 28px; padding: 16px 0 8px; margin-bottom: 18px; text-align: center;
    background-color: #0d4160; border: 1px solid rgba(233,244,246,.15);
  }
  .scene svg { width: 60%; max-width: 240px; height: auto; display: block; margin: 0 auto; overflow: visible; }
  #gouvernail { transition: transform .12s ease-out; }
  .valeur { font-size: 4rem; font-weight: 700; line-height: 1; margin-top: 6px; color: #e9f4f6; }
  .valeur small { font-size: 1.6rem; color: #8fb4c4; font-weight: 400; }
  #sens { color: #8fb4c4; font-size: .95rem; margin: 6px 0 8px; min-height: 1.2em; }

  .reglage { margin-bottom: 18px; }
  .bornes { display: flex; justify-content: space-between; font-size: .8rem; color: #8fb4c4; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: rgba(233,244,246,.25); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 44px; height: 44px; margin-top: -17px; border-radius: 50%;
    background: #ff6a3d; border: 5px solid #e9f4f6;
  }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: rgba(233,244,246,.25); }
  input[type=range]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: #ff6a3d; border: 5px solid #e9f4f6; }

  .boutons { display: flex; margin-bottom: 18px; }
  .boutons button { flex: 1; margin-right: 10px; }
  .boutons button:last-child { margin-right: 0; }
  button {
    font-family: inherit; font-weight: 700; font-size: 1.15rem; color: #e9f4f6;
    border: 1px solid rgba(233,244,246,.3); background-color: #0d4160;
    border-radius: 18px; padding: 18px 12px; cursor: pointer;
  }
  button:active { background-color: #1a5d85; }
  #connexion { width: 100%; background-color: #ff6a3d; border-color: #ff6a3d; color: #1b0a03; font-size: 1.1rem; }
  #connexion.connecte { background-color: transparent; color: #e9f4f6; border-color: rgba(233,244,246,.4); }
  #message { min-height: 1.3em; text-align: center; font-size: .85rem; color: #8fb4c4; margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gouvernail</h1>
    <div id="etat"><i></i><span>Non connecté</span></div>
  </header>

  <section class="scene">
    <svg viewBox="0 0 200 270">
      <path d="M92 240 Q80 258 70 270 M108 240 Q120 258 130 270" stroke="rgba(233,244,246,.25)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 6 C150 50 156 130 148 200 Q146 232 100 236 Q54 232 52 200 C44 130 50 50 100 6 Z" fill="#e9f4f6"/>
      <path d="M100 40 C128 76 132 130 126 196 Q124 214 100 216 Q76 214 74 196 C68 130 72 76 100 40 Z" fill="#0d4160"/>
      <g id="gouvernail" style="transform-origin: 100px 236px;">
        <rect x="95" y="232" width="10" height="34" rx="5" fill="#ff6a3d"/>
      </g>
    </svg>
    <div class="valeur"><span id="angle">90</span><small>°</small></div>
    <div id="sens">Tout droit</div>
  </section>

  <section class="reglage">
    <input type="range" id="curseur" min="55" max="125" value="90">
    <div class="bornes"><span>Bâbord 55°</span><span>Tribord 125°</span></div>
  </section>

  <section class="boutons">
    <button id="moins">−5°</button>
    <button id="centre">Centrer</button>
    <button id="plus">+5°</button>
  </section>

  <button id="connexion">Connecter la micro:bit</button>
  <p id="message"></p>
</main>

<script>
var ANGLE_MIN = 55, ANGLE_MAX = 125, ANGLE_CENTRE = 90, PAS = 5;
var INVERSER_VISUEL = false; // mets true si le gouvernail dessiné tourne à l'envers

var UART_SERVICE = "6e400001-b5a0-f393-e0a9-e50e24dcca9e";
var UART_RX      = "6e400002-b5a0-f393-e0a9-e50e24dcca9e"; // téléphone -> micro:bit

function $(id) { return document.getElementById(id); }
var curseur = $("curseur"), affAngle = $("angle"), sens = $("sens");
var gouvernail = $("gouvernail"), etat = $("etat"), message = $("message"), btnConnexion = $("connexion");

var angle = ANGLE_CENTRE;
var caractRX = null;
var appareil = null;
var envoiEnCours = false;
var dernierEnvoye = null;

function afficher(a) {
  angle = a;
  affAngle.textContent = a;
  curseur.value = a;
  var ecart = a - ANGLE_CENTRE;
  gouvernail.style.transform = "rotate(" + (INVERSER_VISUEL ? ecart : -ecart) + "deg)";
  if (ecart === 0) sens.textContent = "Tout droit";
  else if (ecart > 0) sens.textContent = "Tribord (droite) +" + ecart + "°";
  else sens.textContent = "Bâbord (gauche) " + ecart + "°";
}

function statut(texte, classe) {
  etat.className = classe || "";
  etat.getElementsByTagName("span")[0].textContent = texte;
}

async function envoyerDernier() {
  if (envoiEnCours || !caractRX) return;
  envoiEnCours = true;
  try {
    while (caractRX && dernierEnvoye !== angle) {
      var aEnvoyer = angle;
      var donnees = new TextEncoder().encode(aEnvoyer + "#");
      try { await caractRX.writeValue(donnees); }
      catch (e) { await caractRX.writeValueWithoutResponse(donnees); }
      dernierEnvoye = aEnvoyer;
    }
    message.textContent = "Envoyé : " + dernierEnvoye;
  } catch (e) {
    message.textContent = "Envoi impossible : " + e.message;
  }
  envoiEnCours = false;
}

function commander(a) {
  a = Math.max(ANGLE_MIN, Math.min(ANGLE_MAX, Math.round(a)));
  afficher(a);
  if (!caractRX) { message.textContent = "Connecte d'abord la micro:bit."; return; }
  envoyerDernier();
}

async function connecter() {
  var etape = "démarrage";
  if (!navigator.bluetooth) {
    message.textContent = "Bluetooth indisponible : ouvre cette page dans l'application Bluefy.";
    return;
  }
  try {
    statut("Recherche…");
    etape = "choix de l'appareil";
    appareil = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [UART_SERVICE]
    });
    appareil.addEventListener("gattserverdisconnected", deconnecte);
    statut("Connexion…");

    etape = "connexion GATT";
    var serveur = await appareil.gatt.connect();
    await new Promise(function (r) { setTimeout(r, 1000); });

    etape = "recherche du service UART";
    var service;
    try {
      service = await serveur.getPrimaryService(UART_SERVICE);
    } catch (e1) {
      var liste = [];
      try {
        var tous = await serveur.getPrimaryServices();
        for (var i = 0; i < tous.length; i++) liste.push(tous[i].uuid.slice(0, 8));
      } catch (e2) {}
      throw new Error("service UART introuvable. Services vus : " + (liste.length ? liste.join(", ") : "aucun"));
    }

    etape = "recherche de la caractéristique";
    caractRX = await service.getCharacteristic(UART_RX);

    dernierEnvoye = null;
    statut("Connecté", "ok");
    btnConnexion.textContent = "Déconnecter";
    btnConnexion.className = "connecte";
    message.textContent = "";
    commander(angle);
  } catch (e) {
    caractRX = null;
    statut("Non connecté", "ko");
    var detail = (e && e.message) ? e.message : String(e);
    var nom = (e && e.name) ? e.name + " - " : "";
    if (e && e.name === "NotFoundError" && etape === "choix de l'appareil") {
      message.textContent = "Aucun appareil choisi.";
    } else {
      message.textContent = "Échec à l'étape « " + etape + " » : " + nom + detail;
    }
  }
}

function deconnecte() {
  caractRX = null;
  statut("Déconnecté", "ko");
  btnConnexion.textContent = "Connecter la micro:bit";
  btnConnexion.className = "";
}

btnConnexion.addEventListener("click", function () {
  if (appareil && appareil.gatt.connected) appareil.gatt.disconnect();
  else connecter();
});

curseur.addEventListener("input", function () { commander(parseInt(curseur.value, 10)); });
$("centre").addEventListener("click", function () { commander(ANGLE_CENTRE); });

// Les boutons ±5° se répètent tant qu'on les maintient appuyés
function boutonRepete(id, delta) {
  var b = $(id), attente = null, boucle = null;
  function arreter() { clearTimeout(attente); clearInterval(boucle); }
  b.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    commander(angle + delta);
    arreter();
    attente = setTimeout(function () {
      boucle = setInterval(function () { commander(angle + delta); }, 120);
    }, 350);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, arreter); });
  b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
}
boutonRepete("plus", PAS);
boutonRepete("moins", -PAS);

afficher(ANGLE_CENTRE);
</script>
</body>
</html>
