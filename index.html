<script>
    let bluetoothDevice = null;
    let uartCharacteristic = null;
    let currentAngle = 90;

    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_RX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    function setStatus(text, ok) {
        const s = document.getElementById('status');
        s.innerText = text;
        s.style.color = ok ? "#16a34a" : "#dc2626";
        s.style.background = ok ? "#dcfce7" : "#fee2e2";
    }

    async function connectBluetooth() {
        try {
            setStatus("Recherche en cours...", false);

            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "BBC micro:bit" }],
                optionalServices: [UART_SERVICE_UUID]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                uartCharacteristic = null;
                setStatus("Statut : Déconnecté", false);
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            uartCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

            setStatus("Statut : Connecté ✓", true);
        } catch (error) {
            console.error(error);
            setStatus("Échec : " + error.message, false);
        }
    }

    async function sendToMicrobit(val) {
        if (!uartCharacteristic) {
            alert("Veuillez d'abord vous connecter en Bluetooth !");
            return;
        }
        const data = new TextEncoder().encode(val + "\n");
        try {
            if (uartCharacteristic.writeValueWithoutResponse) {
                await uartCharacteristic.writeValueWithoutResponse(data);
            } else {
                await uartCharacteristic.writeValue(data);
            }
        } catch (e1) {
            try {
                await uartCharacteristic.writeValue(data);
            } catch (e2) {
                alert("Erreur d'envoi : " + e2.message);
            }
        }
    }

    function changeAngle(delta) {
        currentAngle = Math.min(125, Math.max(55, currentAngle + delta));
        document.getElementById('angleVal').innerText = currentAngle;
        sendToMicrobit(currentAngle);
    }

    function resetAngle() {
        currentAngle = 90;
        document.getElementById('angleVal').innerText = currentAngle;
        sendToMicrobit(currentAngle);
    }
</script>
