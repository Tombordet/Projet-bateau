<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécommande Bateau - Micro:bit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        #status {
            font-weight: bold;
            color: #d9534f;
            margin: 15px 0;
        }
        .btn {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #connectBtn { background-color: #0275d8; }
        .dirBtn { background-color: #5cb85c; }
        .dirBtn:active { background-color: #4cae4c; }
    </style>
</head>
<body>

    <h1>Télécommande du Bateau</h1>
    <div id="status">Statut : Déconnecté</div>

    <button id="connectBtn" onclick="connectBluetooth()">Connexion Bluetooth</button>

    <br><br>

    <button class="dirBtn" onclick="sendCommand('gauche')">◄ GAUCHE (Bâbord)</button>
    <button class="dirBtn" onclick="sendCommand('centre')">• MILIEU (Centre)</button>
    <button class="dirBtn" onclick="sendCommand('droite')">► DROITE (Tribord)</button>

    <script>
        let bluetoothDevice;
        let uartCharacteristic;

        // UUIDs standard UART pour Micro:bit
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "Statut : Recherche de la micro:bit...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "Micro" }, { services: [UART_SERVICE_UUID] }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                uartCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                document.getElementById('status').innerText = "Statut : Connecté !";
                document.getElementById('status').style.color = "#5cb85c";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Statut : Échec de la connexion";
                document.getElementById('status').style.color = "#d9534f";
            }
        }

        async function sendCommand(cmd) {
            if (!uartCharacteristic) {
                alert("Veuillez d'abord vous connecter en Bluetooth !");
                return;
            }
            try {
                const encoder = new TextEncoder();
                // On envoie la commande avec un retour à la ligne pour correspondre au code MakeCode
                const data = encoder.encode(cmd + "\n");
                await uartCharacteristic.writeValue(data);
            } catch (error) {
                console.error("Erreur lors de l'envoi : ", error);
            }
        }
    </script>

</body>
</html>
